<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adorners — Billing Tool</title>
<style>
  :root {
    --navy: #1a2744;
    --band: #dbe5f1;
    --border: #c7c7c7;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    margin: 0;
    color: #1a1a1a;
    background: #f4f4f5;
  }
  #app { max-width: 900px; margin: 0 auto; padding: 24px; }
  .screen.hidden { display: none; }
  h1, h2 { margin: 0 0 16px; }
  button {
    font: inherit;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  button.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  input[type=text], input[type=number], input[type=date] {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 100%;
  }
  label { display: block; font-size: 13px; color: #444; margin-bottom: 4px; }
  .field-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .field-row > div { flex: 1; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  thead th { background: var(--navy); color: #fff; }
  tbody tr:nth-child(even) { background: var(--band); }
  tfoot td { font-weight: bold; }
  .error { color: var(--error); font-size: 13px; margin-bottom: 12px; }
  .error.hidden { display: none; }
  .actions { display: flex; gap: 8px; margin-top: 16px; }
  .doc-row { display: flex; justify-content: space-between; padding: 10px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; cursor: pointer; background: #fff; }
  .doc-row:hover { background: #eef1f7; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--band); }

  /* Print output is a separate, plain rendering (#print-area) built fresh from the
     document data — not the live editor form — so it can match the existing
     Word documents exactly instead of looking like a printed web form. */
  .print-only { display: none; }
  @media print {
    body { background: #fff; margin: 0; }
    #app { display: none; }
    .print-only { display: block; }
    @page { margin: 2in 0.75in 0.75in 0.75in; }
  }
  .print-doc { font-family: 'Times New Roman', Georgia, serif; color: #000; }
  .print-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
  .print-title { text-align: center; text-decoration: underline; font-size: 18px; margin: 0 0 16px; }
  .print-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .print-table th, .print-table td { border: 1px solid #333; padding: 6px 8px; text-align: left; vertical-align: top; }
  .print-table thead th { background: var(--navy); color: #fff; }
  .print-table tbody tr:nth-child(even) { background: var(--band); }
  .print-table tfoot td { font-weight: bold; }
  .print-table tfoot tr.grand-total-row td { border-top: 2px solid #333; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <div id="screen-list" class="screen"></div>
  <div id="screen-voucher" class="screen hidden"></div>
  <div id="screen-quotation" class="screen hidden"></div>
</div>
<div id="print-area" class="print-only"></div>

<script src="calculations.js"></script>
<script>
/* ===== STORAGE ===== */
const STORAGE_KEY = 'adorners_billing_documents';

function loadDocuments() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (err) {
    alert('Could not read saved documents: ' + err.message);
    return [];
  }
}

function saveDocument(doc) {
  try {
    const docs = loadDocuments();
    doc.updatedAt = new Date().toISOString();
    const idx = docs.findIndex(d => d.id === doc.id);
    if (idx === -1) {
      doc.createdAt = doc.updatedAt;
      docs.push(doc);
    } else {
      docs[idx] = doc;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(docs));
    return true;
  } catch (err) {
    alert('Could not save document: ' + err.message);
    return false;
  }
}

function getDocument(id) {
  return loadDocuments().find(d => d.id === id) || null;
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ===== HELPERS ===== */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function formatCurrency(amount) {
  const rounded = Math.round(amount || 0);
  return `Rs.${rounded.toLocaleString('en-US')}/-`;
}

function todayIso() {
  return new Date().toISOString().slice(0, 10);
}

// "2026-07-28" -> "28th July 2026", matching how dates are written on the existing documents.
function formatDateLong(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const day = date.getDate();
  const suffix = (day % 10 === 1 && day !== 11) ? 'st'
    : (day % 10 === 2 && day !== 12) ? 'nd'
    : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
  const month = date.toLocaleString('en-US', { month: 'long' });
  return `${day}${suffix} ${month} ${date.getFullYear()}`;
}

// "2026-05-18" -> "18-05-26", matching the date format used in the existing voucher rows.
function formatDateShort(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}-${m}-${y.slice(2)}`;
}

/* ===== SCREEN SWITCHING ===== */
let currentDoc = null;

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
  document.getElementById('screen-' + name).classList.remove('hidden');
}

/* ===== RENDER: VOUCHER EDITOR ===== */
function openNewVoucher() {
  currentDoc = { id: generateId(), type: 'voucher', clientName: '', date: todayIso(), entries: [] };
  showScreen('voucher');
  renderVoucherEditor();
}

function renderVoucherEditor() {
  const d = currentDoc;
  const rows = d.entries.map((entry, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><input type="date" data-idx="${i}" data-field="date" value="${entry.date}"></td>
      <td><input type="text" data-idx="${i}" data-field="detail" value="${escapeHtml(entry.detail)}"></td>
      <td><input type="number" data-idx="${i}" data-field="amount" value="${entry.amount}"></td>
      <td class="no-print"><button class="remove-row" data-idx="${i}">Remove</button></td>
    </tr>`).join('');

  document.getElementById('screen-voucher').innerHTML = `
    <div class="no-print"><button id="v-back-btn">&larr; Back</button></div>
    <h2>Payment Voucher</h2>
    <div id="v-validation-msg" class="error hidden"></div>
    <div class="field-row">
      <div><label>Client Name</label><input type="text" id="v-f-client" value="${escapeHtml(d.clientName)}"></div>
      <div><label>Date</label><input type="date" id="v-f-date" value="${d.date}"></div>
    </div>
    <table>
      <thead><tr><th>S.No</th><th>Date</th><th>Detail</th><th>Amount</th><th class="no-print"></th></tr></thead>
      <tbody id="entries-tbody">${rows}</tbody>
      <tfoot><tr><td colspan="3">Total</td><td id="voucher-total">${formatCurrency(calcVoucherGrandTotal(d.entries))}</td><td class="no-print"></td></tr></tfoot>
    </table>
    <button class="no-print" id="add-row-btn">+ Add Row</button>
    <div class="actions no-print">
      <button class="primary" id="v-save-btn">Save</button>
      <button id="v-pdf-btn">Download PDF</button>
    </div>
  `;
  attachVoucherEditorEvents();
}

function attachVoucherEditorEvents() {
  document.getElementById('v-back-btn').addEventListener('click', () => { showScreen('list'); renderList(); });

  document.getElementById('v-f-client').addEventListener('input', e => { currentDoc.clientName = e.target.value; });
  document.getElementById('v-f-date').addEventListener('input', e => { currentDoc.date = e.target.value; });

  document.querySelectorAll('#entries-tbody input').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = Number(e.target.dataset.idx);
      const field = e.target.dataset.field;
      currentDoc.entries[idx][field] = field === 'amount' ? Number(e.target.value) || 0 : e.target.value;
      if (field === 'amount') {
        document.getElementById('voucher-total').textContent = formatCurrency(calcVoucherGrandTotal(currentDoc.entries));
      }
    });
  });

  document.getElementById('add-row-btn').addEventListener('click', () => {
    currentDoc.entries.push({ date: currentDoc.date, detail: '', amount: 0 });
    renderVoucherEditor();
  });

  document.querySelectorAll('.remove-row').forEach(btn => {
    btn.addEventListener('click', (e) => {
      currentDoc.entries.splice(Number(e.target.dataset.idx), 1);
      renderVoucherEditor();
    });
  });

  document.getElementById('v-save-btn').addEventListener('click', () => {
    const msg = document.getElementById('v-validation-msg');
    if (!currentDoc.clientName.trim() || !currentDoc.date) {
      msg.textContent = 'Client name and date are required.';
      msg.classList.remove('hidden');
      return;
    }
    msg.classList.add('hidden');
    currentDoc.entries = currentDoc.entries.filter(e => e.detail.trim() || e.amount);
    if (saveDocument(currentDoc)) { showScreen('list'); renderList(); }
  });

  document.getElementById('v-pdf-btn').addEventListener('click', () => {
    renderVoucherPrintView(currentDoc);
    window.print();
  });
}

/* ===== PRINT: VOUCHER =====
   A plain, static rendering built straight from the document data — matches the
   existing "Mr. X / Date: X" header, underlined title, and dark-header table used
   in the current Word documents. */
function renderVoucherPrintView(doc) {
  const rows = doc.entries.map((entry, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${formatDateShort(entry.date)}</td>
      <td>${escapeHtml(entry.detail)}</td>
      <td>${formatCurrency(entry.amount)}</td>
    </tr>`).join('');

  document.getElementById('print-area').innerHTML = `
    <div class="print-doc">
      <div class="print-header">
        <div>Mr. ${escapeHtml(doc.clientName)}</div>
        <div>Date: <strong>${formatDateLong(doc.date)}</strong></div>
      </div>
      <h2 class="print-title">Payment Voucher</h2>
      <table class="print-table">
        <thead><tr><th>S. No.</th><th>Date</th><th>Detail</th><th>Amount</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="3">Total</td><td>${formatCurrency(calcVoucherGrandTotal(doc.entries))}</td></tr></tfoot>
      </table>
    </div>`;
}

/* ===== RENDER: QUOTATION EDITOR ===== */
function openNewQuotation() {
  currentDoc = {
    id: generateId(), type: 'quotation', clientName: '', date: todayIso(), categories: [],
    summary: { quotationApprovalAmount: 0, paymentReceived: 0, adjustments: [] },
  };
  showScreen('quotation');
  renderQuotationEditor();
}

// Documents saved before the payment-summary feature existed have no `summary` field.
function normalizeQuotation(doc) {
  doc.summary = doc.summary || { quotationApprovalAmount: 0, paymentReceived: 0, adjustments: [] };
  return doc;
}

function renderQuotationEditor() {
  const d = currentDoc;

  const categoriesHtml = d.categories.map((cat, ci) => {
    const itemRows = cat.items.map((item, ii) => `
      <tr>
        <td><input type="text" data-ci="${ci}" data-ii="${ii}" data-field="description" value="${escapeHtml(item.description)}"></td>
        <td><input type="number" data-ci="${ci}" data-ii="${ii}" data-field="qty" value="${item.qty}" style="width:70px;"></td>
        <td><input type="text" data-ci="${ci}" data-ii="${ii}" data-field="unit" value="${escapeHtml(item.unit || '')}" style="width:60px;"></td>
        <td><input type="number" data-ci="${ci}" data-ii="${ii}" data-field="rate" value="${item.rate}" style="width:100px;"></td>
        <td class="item-amount" data-ci="${ci}" data-ii="${ii}">${formatCurrency(calcLineAmount(item.qty, item.rate))}</td>
        <td class="no-print"><button class="remove-item" data-ci="${ci}" data-ii="${ii}">Remove</button></td>
      </tr>`).join('');

    return `
      <div style="margin-bottom:20px;border:1px solid var(--border);border-radius:4px;padding:12px;">
        <div class="field-row" style="align-items:flex-end;">
          <div style="flex:2;">
            <label>Category</label>
            <input type="text" data-ci="${ci}" data-field="name" value="${escapeHtml(cat.name)}" placeholder="e.g. Electrician">
          </div>
          <button class="no-print remove-category" data-ci="${ci}">Remove Category</button>
        </div>
        <table>
          <thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Rate</th><th>Amount</th><th class="no-print"></th></tr></thead>
          <tbody>${itemRows}</tbody>
          <tfoot><tr><td colspan="4">Subtotal</td><td class="category-subtotal" data-ci="${ci}">${formatCurrency(calcCategorySubtotal(cat.items))}</td><td class="no-print"></td></tr></tfoot>
        </table>
        <button class="no-print add-item-btn" data-ci="${ci}">+ Add Item</button>
      </div>`;
  }).join('');

  const itemsTotal = calcQuotationGrandTotal(d.categories);
  const totalAmount = calcTotalAmount(itemsTotal, d.summary.quotationApprovalAmount);
  const balance = calcBalance(totalAmount, d.summary.paymentReceived, d.summary.adjustments);

  const adjustmentsHtml = d.summary.adjustments.map((adj, ai) => `
    <div class="field-row" style="align-items:flex-end;">
      <div style="flex:2;"><label>Adjustment (e.g. "Gazebo Difference")</label><input type="text" data-ai="${ai}" data-field="label" value="${escapeHtml(adj.label)}"></div>
      <div><label>Amount</label><input type="number" data-ai="${ai}" data-field="amount" value="${adj.amount}"></div>
      <button class="no-print remove-adjustment" data-ai="${ai}">Remove</button>
    </div>`).join('');

  document.getElementById('screen-quotation').innerHTML = `
    <div class="no-print"><button id="q-back-btn">&larr; Back</button></div>
    <h2>Quotation</h2>
    <div id="q-validation-msg" class="error hidden"></div>
    <div class="field-row">
      <div><label>Client Name</label><input type="text" id="q-f-client" value="${escapeHtml(d.clientName)}"></div>
      <div><label>Date</label><input type="date" id="q-f-date" value="${d.date}"></div>
    </div>
    <div id="categories-container">${categoriesHtml}</div>
    <button class="no-print" id="add-category-btn">+ Add Category</button>

    <div style="margin-top:20px;border:1px solid var(--border);border-radius:4px;padding:12px;">
      <label style="font-size:15px;font-weight:bold;color:#1a1a1a;">Summary</label>
      <div class="field-row">
        <div><label>Quotation Approval Amount</label><input type="number" id="q-approval-amount" value="${d.summary.quotationApprovalAmount}"></div>
        <div><label>Payment Received</label><input type="number" id="q-payment-received" value="${d.summary.paymentReceived}"></div>
      </div>
      <div id="adjustments-container">${adjustmentsHtml}</div>
      <button class="no-print" id="add-adjustment-btn">+ Add Adjustment</button>
      <div style="margin-top:12px;line-height:1.8;">
        <div>Additional Work Amount: <strong id="quotation-total">${formatCurrency(itemsTotal)}</strong></div>
        <div>Total Amount: <strong id="q-total-amount">${formatCurrency(totalAmount)}</strong></div>
        <div>Balance Amount: <strong id="q-balance-amount">${formatCurrency(balance)}</strong></div>
      </div>
    </div>

    <div class="actions no-print">
      <button class="primary" id="q-save-btn">Save</button>
      <button id="q-pdf-btn">Download PDF</button>
    </div>
  `;
  attachQuotationEditorEvents();
}

function refreshQuotationSummaryTotals() {
  const itemsTotal = calcQuotationGrandTotal(currentDoc.categories);
  const totalAmount = calcTotalAmount(itemsTotal, currentDoc.summary.quotationApprovalAmount);
  const balance = calcBalance(totalAmount, currentDoc.summary.paymentReceived, currentDoc.summary.adjustments);
  document.getElementById('quotation-total').textContent = formatCurrency(itemsTotal);
  document.getElementById('q-total-amount').textContent = formatCurrency(totalAmount);
  document.getElementById('q-balance-amount').textContent = formatCurrency(balance);
}

function attachQuotationEditorEvents() {
  document.getElementById('q-back-btn').addEventListener('click', () => { showScreen('list'); renderList(); });
  document.getElementById('q-f-client').addEventListener('input', e => { currentDoc.clientName = e.target.value; });
  document.getElementById('q-f-date').addEventListener('input', e => { currentDoc.date = e.target.value; });

  document.querySelectorAll('[data-field="name"]').forEach(input => {
    input.addEventListener('input', e => {
      currentDoc.categories[Number(e.target.dataset.ci)].name = e.target.value;
    });
  });

  document.querySelectorAll('#categories-container input[data-ii]').forEach(input => {
    input.addEventListener('input', e => {
      const ci = Number(e.target.dataset.ci);
      const ii = Number(e.target.dataset.ii);
      const field = e.target.dataset.field;
      const item = currentDoc.categories[ci].items[ii];
      item[field] = (field === 'qty' || field === 'rate') ? Number(e.target.value) || 0 : e.target.value;
      if (field === 'qty' || field === 'rate') {
        document.querySelector(`.item-amount[data-ci="${ci}"][data-ii="${ii}"]`).textContent =
          formatCurrency(calcLineAmount(item.qty, item.rate));
        document.querySelector(`.category-subtotal[data-ci="${ci}"]`).textContent =
          formatCurrency(calcCategorySubtotal(currentDoc.categories[ci].items));
        refreshQuotationSummaryTotals();
      }
    });
  });

  document.getElementById('add-category-btn').addEventListener('click', () => {
    currentDoc.categories.push({ name: '', items: [] });
    renderQuotationEditor();
  });

  document.querySelectorAll('.remove-category').forEach(btn => {
    btn.addEventListener('click', e => {
      currentDoc.categories.splice(Number(e.target.dataset.ci), 1);
      renderQuotationEditor();
    });
  });

  document.querySelectorAll('.add-item-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      currentDoc.categories[Number(e.target.dataset.ci)].items.push({ description: '', qty: 1, unit: '', rate: 0 });
      renderQuotationEditor();
    });
  });

  document.querySelectorAll('.remove-item').forEach(btn => {
    btn.addEventListener('click', e => {
      currentDoc.categories[Number(e.target.dataset.ci)].items.splice(Number(e.target.dataset.ii), 1);
      renderQuotationEditor();
    });
  });

  document.getElementById('q-approval-amount').addEventListener('input', e => {
    currentDoc.summary.quotationApprovalAmount = Number(e.target.value) || 0;
    refreshQuotationSummaryTotals();
  });

  document.getElementById('q-payment-received').addEventListener('input', e => {
    currentDoc.summary.paymentReceived = Number(e.target.value) || 0;
    refreshQuotationSummaryTotals();
  });

  document.querySelectorAll('#adjustments-container input').forEach(input => {
    input.addEventListener('input', e => {
      const ai = Number(e.target.dataset.ai);
      const field = e.target.dataset.field;
      currentDoc.summary.adjustments[ai][field] = field === 'amount' ? Number(e.target.value) || 0 : e.target.value;
      if (field === 'amount') refreshQuotationSummaryTotals();
    });
  });

  document.getElementById('add-adjustment-btn').addEventListener('click', () => {
    currentDoc.summary.adjustments.push({ label: '', amount: 0 });
    renderQuotationEditor();
  });

  document.querySelectorAll('.remove-adjustment').forEach(btn => {
    btn.addEventListener('click', e => {
      currentDoc.summary.adjustments.splice(Number(e.target.dataset.ai), 1);
      renderQuotationEditor();
    });
  });

  document.getElementById('q-save-btn').addEventListener('click', () => {
    const msg = document.getElementById('q-validation-msg');
    if (!currentDoc.clientName.trim() || !currentDoc.date) {
      msg.textContent = 'Client name and date are required.';
      msg.classList.remove('hidden');
      return;
    }
    msg.classList.add('hidden');
    currentDoc.categories = currentDoc.categories
      .map(cat => ({ ...cat, items: cat.items.filter(i => i.description.trim() || i.qty || i.rate) }))
      .filter(cat => cat.name.trim() && cat.items.length > 0);
    currentDoc.summary.adjustments = currentDoc.summary.adjustments.filter(a => a.label.trim() || a.amount);
    if (saveDocument(currentDoc)) { showScreen('list'); renderList(); }
  });

  document.getElementById('q-pdf-btn').addEventListener('click', () => {
    renderQuotationPrintView(currentDoc);
    window.print();
  });
}

/* ===== PRINT: QUOTATION =====
   Matches the existing "Bill Additional Work" layout: one row per category, with the
   category name and its bulleted items stacked inside the same cell (Qty/Rate/Amount
   stack line-for-line alongside them) — not a separate table row per item. Subtotals
   are not interleaved between categories; they're listed together at the end of the
   table. If a quotation approval amount, payment received, or adjustment has been
   entered, the end of the table also carries the full payment summary (Additional Work
   Amount / Quotation Approval Amount / Total Amount / Payment Received / Balance Amount,
   plus a running balance after each "Less X" adjustment) — otherwise just a plain
   Grand Total, so a simple first-time quotation doesn't show a wall of zero rows. */
function renderQuotationPrintView(doc) {
  const summary = doc.summary || { quotationApprovalAmount: 0, paymentReceived: 0, adjustments: [] };
  const itemsTotal = calcQuotationGrandTotal(doc.categories);
  const hasSummary = summary.quotationApprovalAmount !== 0 || summary.paymentReceived !== 0 || summary.adjustments.length > 0;

  const rowsHtml = doc.categories.map((cat, ci) => {
    const detailLines = [`<div><strong>${escapeHtml(cat.name)}</strong></div>`]
      .concat(cat.items.map(item => `<div>&bull; ${escapeHtml(item.description)}</div>`));
    const qtyLines = ['<div>&nbsp;</div>']
      .concat(cat.items.map(item => `<div>${item.qty}${item.unit ? ' ' + escapeHtml(item.unit) : ''}</div>`));
    const rateLines = ['<div>&nbsp;</div>']
      .concat(cat.items.map(item => `<div>${formatCurrency(item.rate)}</div>`));
    const amountLines = ['<div>&nbsp;</div>']
      .concat(cat.items.map(item => `<div><strong>${formatCurrency(calcLineAmount(item.qty, item.rate))}</strong></div>`));

    return `
      <tr>
        <td>${ci + 1}.</td>
        <td>${detailLines.join('')}</td>
        <td>${qtyLines.join('')}</td>
        <td>${rateLines.join('')}</td>
        <td>${amountLines.join('')}</td>
      </tr>`;
  }).join('');

  const subtotalRows = doc.categories.map(cat => `
    <tr><td colspan="4">${escapeHtml(cat.name)} Subtotal</td><td>${formatCurrency(calcCategorySubtotal(cat.items))}</td></tr>`
  ).join('');

  let summaryRows;
  if (hasSummary) {
    const totalAmount = calcTotalAmount(itemsTotal, summary.quotationApprovalAmount);
    const balanceAfterPayment = calcBalance(totalAmount, summary.paymentReceived, []);
    let runningBalance = balanceAfterPayment;
    const adjustmentRows = summary.adjustments.map(adj => {
      runningBalance -= adj.amount;
      return `
        <tr><td colspan="4">Less ${escapeHtml(adj.label)}</td><td>${formatCurrency(adj.amount)}</td></tr>
        <tr class="grand-total-row"><td colspan="4">Balance Amount</td><td>${formatCurrency(runningBalance)}</td></tr>`;
    }).join('');
    summaryRows = `
      <tr><td colspan="4">Additional Work Amount</td><td>${formatCurrency(itemsTotal)}</td></tr>
      <tr><td colspan="4">Quotation Approval Amount</td><td>${formatCurrency(summary.quotationApprovalAmount)}</td></tr>
      <tr><td colspan="4">Total Amount</td><td>${formatCurrency(totalAmount)}</td></tr>
      <tr><td colspan="4">Payment Received</td><td>${formatCurrency(summary.paymentReceived)}</td></tr>
      <tr class="grand-total-row"><td colspan="4">Balance Amount</td><td>${formatCurrency(balanceAfterPayment)}</td></tr>
      ${adjustmentRows}`;
  } else {
    summaryRows = `<tr class="grand-total-row"><td colspan="4">Grand Total</td><td>${formatCurrency(itemsTotal)}</td></tr>`;
  }

  document.getElementById('print-area').innerHTML = `
    <div class="print-doc">
      <div class="print-header">
        <div>Mr. ${escapeHtml(doc.clientName)}</div>
        <div>Date: <strong>${formatDateLong(doc.date)}</strong></div>
      </div>
      <h2 class="print-title">Quotation</h2>
      <table class="print-table">
        <thead><tr><th>S. No.</th><th>Details</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot>
          ${subtotalRows}
          ${summaryRows}
        </tfoot>
      </table>
    </div>`;
}

/* ===== RENDER: LIST ===== */
function renderList(filter = '') {
  const docs = loadDocuments()
    .filter(d => d.clientName.toLowerCase().includes(filter.toLowerCase()))
    .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

  const rows = docs.map(d => {
    const total = d.type === 'voucher'
      ? calcVoucherGrandTotal(d.entries)
      : calcQuotationGrandTotal(d.categories);
    return `
      <div class="doc-row" data-id="${d.id}" data-type="${d.type}">
        <div>
          <strong>${escapeHtml(d.clientName)}</strong>
          <span class="badge">${d.type === 'voucher' ? 'Voucher' : 'Quotation'}</span>
          <div style="font-size:13px;color:#666;">${d.date}</div>
        </div>
        <div>${formatCurrency(total)}</div>
      </div>`;
  }).join('') || '<p style="color:#666;">No documents yet.</p>';

  document.getElementById('screen-list').innerHTML = `
    <h1>Adorners Billing</h1>
    <div class="actions">
      <button class="primary" id="new-voucher-btn">+ New Payment Voucher</button>
      <button class="primary" id="new-quotation-btn">+ New Quotation</button>
    </div>
    <div style="margin:16px 0;">
      <input type="text" id="search-input" placeholder="Search by client name..." value="${escapeHtml(filter)}">
    </div>
    <div id="doc-rows">${rows}</div>
  `;

  document.getElementById('new-voucher-btn').addEventListener('click', () => openNewVoucher());
  document.getElementById('new-quotation-btn').addEventListener('click', () => openNewQuotation());
  document.getElementById('search-input').addEventListener('input', (e) => renderList(e.target.value));
  document.querySelectorAll('.doc-row').forEach(row => {
    row.addEventListener('click', () => openExistingDocument(row.dataset.id, row.dataset.type));
  });
}

function openExistingDocument(id, type) {
  currentDoc = getDocument(id);
  if (!currentDoc) return;
  if (type === 'voucher') { showScreen('voucher'); renderVoucherEditor(); }
  else { normalizeQuotation(currentDoc); showScreen('quotation'); renderQuotationEditor(); }
}

/* ===== INIT ===== */
function init() {
  showScreen('list');
  renderList();
}
init();
</script>
</body>
</html>
