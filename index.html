<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adorners — Billing Tool</title>
<style>
  :root {
    --navy: #1a2744;
    --band: #dbe5f1;
    --border: #c7c7c7;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    margin: 0;
    color: #1a1a1a;
    background: #f4f4f5;
  }
  #app { max-width: 900px; margin: 0 auto; padding: 24px; }
  .screen.hidden { display: none; }
  /* On a phone, the table (dates/amounts/remove button) is wider than the screen.
     Scrolling just the table horizontally keeps the rest of the page (buttons,
     fields) usable without the whole page breaking sideways. */
  .table-scroll { overflow-x: auto; margin-bottom: 12px; }
  .table-scroll table { margin-bottom: 0; }
  @media (max-width: 600px) {
    #app { padding: 12px; }
  }
  h1, h2 { margin: 0 0 16px; }
  button {
    font: inherit;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  button.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  input[type=text], input[type=number], input[type=date] {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    width: 100%;
  }
  label { display: block; font-size: 13px; color: #444; margin-bottom: 4px; }
  .field-row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  .field-row > div { flex: 1; min-width: 140px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  thead th { background: var(--navy); color: #fff; }
  tbody tr:nth-child(even) { background: var(--band); }
  tfoot td { font-weight: bold; }
  .error { color: var(--error); font-size: 13px; margin-bottom: 12px; }
  .error.hidden { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .doc-row { display: flex; justify-content: space-between; padding: 10px; border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; cursor: pointer; background: #fff; }
  .doc-row:hover { background: #eef1f7; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--band); }
  .print-tip { font-size: 13px; color: #444; margin-top: 8px; }

  /* Print output is a separate, plain rendering (#print-area) built fresh from the
     document data — not the live editor form — so it can match the existing
     Word documents exactly instead of looking like a printed web form. */
  .print-only { display: none; }
  @media print {
    body { background: #fff; margin: 0; }
    #app { display: none; }
    .print-only { display: block; }
    @page { margin: 2in 0.75in 0.75in 0.75in; }
  }
  .print-doc { font-family: 'Times New Roman', Georgia, serif; color: #000; }
  .print-header { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
  .print-title { text-align: center; text-decoration: underline; font-size: 18px; margin: 0 0 16px; }
  .print-table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: auto; }
  .print-table th, .print-table td { border: 1px solid #333; padding: 6px 8px; text-align: left; vertical-align: top; }
  /* Browsers strip background colors when printing/exporting to PDF unless told
     not to (Chrome's "Background graphics" is unchecked by default) — without this,
     the navy header silently prints as plain white/gray. */
  .print-table thead th {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    background: var(--navy);
    color: #fff;
  }
  /* No alternating row shading in the printed output — every row stays plain white. */
  .print-table tbody tr:nth-child(even) { background: none; }
  .print-table tfoot td { font-weight: bold; }
  .print-table tfoot tr.grand-total-row td { border-top: 2px solid #333; font-size: 14px; }

  /* Columns whose content is always short and fixed-format (S.No, Date, Qty) shrink
     to fit that content instead of holding a wide fixed share and sitting mostly
     empty. Detail/Details get no width rule at all, so the table's auto layout gives
     it whatever's left based on its own actual content each time. Shared by both
     document kinds — Quotation and Billing both use print-table-categorized. */
  .print-table-ledger th:nth-child(1), .print-table-ledger td:nth-child(1),
  .print-table-ledger th:nth-child(2), .print-table-ledger td:nth-child(2) {
    width: 1%; white-space: nowrap;
  }
  .print-table-categorized th:nth-child(1), .print-table-categorized td:nth-child(1),
  .print-table-categorized th:nth-child(3), .print-table-categorized td:nth-child(3),
  .print-table-categorized th:nth-child(4), .print-table-categorized td:nth-child(4) {
    width: 1%; white-space: nowrap;
  }
  /* Amount also shrinks to its content, but with extra trailing padding so it isn't
     squeezed as tight as S.No/Qty/Rate. Left padding stays the same as every other
     column so "Amount" still starts flush with the other headers — only padding-right
     grows, which widens the column without shifting its text out of alignment. */
  .print-table-categorized th:nth-child(5), .print-table-categorized td:nth-child(5) {
    width: 1%; white-space: nowrap; padding-right: 24px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="screen-login" class="screen"></div>
  <div id="screen-list" class="screen hidden"></div>
  <div id="screen-ledger" class="screen hidden"></div>
  <div id="screen-categorized" class="screen hidden"></div>
  <div id="screen-daily" class="screen hidden"></div>
</div>
<div id="print-area" class="print-only"></div>

<script>
/* ===== CALCULATIONS =====
   Kept identical to calculations.js (tested separately via calculations.test.html)
   and inlined here so this single file is everything Adorners needs — no second
   file to remember to copy alongside it. If you change the math, update both. */
function calcLineAmount(qty, rate) {
  return qty * rate;
}

function calcCategorySubtotal(items) {
  return items.reduce((sum, item) => sum + calcLineAmount(item.qty, item.rate), 0);
}

function calcCategorizedGrandTotal(categories) {
  return categories.reduce((sum, cat) => sum + calcCategorySubtotal(cat.items), 0);
}

function calcLedgerGrandTotal(entries) {
  return entries.reduce((sum, entry) => sum + entry.amount, 0);
}

function calcTotalAmount(itemsTotal, quotationApprovalAmount) {
  return itemsTotal + quotationApprovalAmount;
}

function calcBalance(totalAmount, paymentReceived, adjustments) {
  return adjustments.reduce((balance, adj) => balance - adj.amount, totalAmount - paymentReceived);
}

// Groups flat Daily Expense Tracker entries by date, sorted chronologically,
// each with its own subtotal — the grouping/subtotal is purely a display
// concern, entries themselves stay a flat list for simple data entry.
function groupEntriesByDate(entries) {
  const byDate = {};
  for (const entry of entries) {
    if (!byDate[entry.date]) byDate[entry.date] = [];
    byDate[entry.date].push(entry);
  }
  return Object.keys(byDate).sort().map(date => ({
    date,
    entries: byDate[date],
    subtotal: calcLedgerGrandTotal(byDate[date]),
  }));
}

// Totals Daily Expense Tracker entries by recipient regardless of date —
// "how much has gone to Labor overall" vs groupEntriesByDate's "what happened
// on this day". Sorted by total descending (biggest recipient first).
function groupByPaidTo(entries) {
  const byPerson = {};
  for (const entry of entries) {
    const key = entry.paidTo.trim() || '(unspecified)';
    byPerson[key] = (byPerson[key] || 0) + entry.amount;
  }
  return Object.entries(byPerson)
    .map(([paidTo, total]) => ({ paidTo, total }))
    .sort((a, b) => b.total - a.total);
}

// Turns flat Daily Expense Tracker entries into Categorized-shape categories
// (for the "Save as Quotation/Billing" conversion) — one category per unique
// recipient, with every payment to them as its own line item inside it,
// instead of a separate category per entry (which would show "Labor" three
// times over for three separate payments to Labor).
function groupEntriesForConversion(entries) {
  const byPerson = {};
  const order = [];
  for (const entry of entries) {
    const key = entry.paidTo.trim() || entry.detail.trim() || '(untitled)';
    if (!byPerson[key]) { byPerson[key] = []; order.push(key); }
    byPerson[key].push(entry);
  }
  return order.map(name => ({
    name,
    items: byPerson[name].map(e => ({ description: e.detail, qty: 1, unit: '', rate: e.amount })),
  }));
}

/* ===== DOCUMENT TYPES =====
   Three shapes ("kinds"):
   - "ledger": Date/Detail/Amount rows + running total -> Payment Voucher
   - "categorized": Category -> Items -> Qty/Rate/Amount -> subtotals -> grand total,
     with the optional approval/payment/adjustments summary -> Quotation, Billing
   - "daily": Date/Paid To/Detail/Amount rows, entered as a flat list but grouped by
     date (with a subtotal per day) for viewing/printing -> Daily Expense Tracker */
const DOC_TYPES = {
  voucher:      { kind: 'ledger',      heading: 'Payment Voucher' },
  quotation:    { kind: 'categorized', heading: 'Quotation' },
  billing:      { kind: 'categorized', heading: 'Billing' },
  dailyExpense: { kind: 'daily',       heading: 'Daily Expense Tracker' },
};

/* ===== STORAGE =====
   Documents live server-side (one shared JSON blob via /api/documents), not in
   this browser's localStorage — so the same saved documents show up on every
   device instead of being stuck on whichever phone/computer created them.
   documentsCache holds the current copy in memory; loadDocuments()/getDocument()
   read from it synchronously (unchanged call sites), while saveDocument() is now
   async — it updates the cache immediately, then persists it to the server. */
let documentsCache = [];

async function fetchDocumentsFromServer() {
  // Cache-buster query param defeats any HTTP caching between here and the
  // server (browser, CDN, proxy) — otherwise a device can briefly see a stale
  // list right after another device just saved something.
  const res = await fetch('/api/documents?_=' + Date.now(), { cache: 'no-store' });
  if (res.status === 401) return 'unauthorized';
  if (!res.ok) throw new Error('Server returned ' + res.status);
  documentsCache = await res.json();
  return 'ok';
}

function loadDocuments() {
  return documentsCache;
}

async function saveDocument(doc) {
  doc.updatedAt = new Date().toISOString();
  const idx = documentsCache.findIndex(d => d.id === doc.id);
  if (idx === -1) {
    doc.createdAt = doc.updatedAt;
    documentsCache.push(doc);
  } else {
    documentsCache[idx] = doc;
  }
  try {
    const res = await fetch('/api/documents', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(documentsCache),
    });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    return true;
  } catch (err) {
    alert('Could not save document — it may not show up on your other devices: ' + err.message);
    return false;
  }
}

function getDocument(id) {
  return loadDocuments().find(d => d.id === id) || null;
}

async function deleteDocument(id) {
  const before = documentsCache.length;
  documentsCache = documentsCache.filter(d => d.id !== id);
  if (documentsCache.length === before) return true; // already gone, nothing to persist
  try {
    const res = await fetch('/api/documents', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(documentsCache),
    });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    return true;
  } catch (err) {
    alert('Could not delete document: ' + err.message);
    return false;
  }
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/* ===== HELPERS ===== */
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

function formatCurrency(amount) {
  const rounded = Math.round(amount || 0);
  return `Rs.${rounded.toLocaleString('en-US')}/-`;
}

function todayIso() {
  return new Date().toISOString().slice(0, 10);
}

// "2026-07-28" -> "28th July 2026", matching how dates are written on the existing documents.
function formatDateLong(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const day = date.getDate();
  const suffix = (day % 10 === 1 && day !== 11) ? 'st'
    : (day % 10 === 2 && day !== 12) ? 'nd'
    : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
  const month = date.toLocaleString('en-US', { month: 'long' });
  return `${day}${suffix} ${month} ${date.getFullYear()}`;
}

// "2026-05-18" -> "18-05-26", matching the date format used in the existing voucher rows.
function formatDateShort(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}-${m}-${y.slice(2)}`;
}

/* ===== SCREEN SWITCHING ===== */
let currentDoc = null;

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(el => el.classList.add('hidden'));
  document.getElementById('screen-' + name).classList.remove('hidden');
}

/* ===== RENDER: LEDGER EDITOR (Payment Voucher) ===== */
function openNewLedger(type) {
  currentDoc = { id: generateId(), type, clientName: '', date: todayIso(), entries: [] };
  showScreen('ledger');
  renderLedgerEditor();
}

function renderLedgerEditor() {
  const d = currentDoc;
  const heading = DOC_TYPES[d.type].heading;
  const rows = d.entries.map((entry, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><input type="date" data-idx="${i}" data-field="date" value="${entry.date}"></td>
      <td><input type="text" data-idx="${i}" data-field="detail" value="${escapeHtml(entry.detail)}"></td>
      <td><input type="number" data-idx="${i}" data-field="amount" value="${entry.amount}"></td>
      <td class="no-print"><button class="remove-row" data-idx="${i}">Remove</button></td>
    </tr>`).join('');

  document.getElementById('screen-ledger').innerHTML = `
    <div class="no-print"><button id="v-back-btn">&larr; Back</button></div>
    <h2>${heading}</h2>
    <div id="v-validation-msg" class="error hidden"></div>
    <div class="field-row">
      <div><label>Client Name</label><input type="text" id="v-f-client" value="${escapeHtml(d.clientName)}"></div>
      <div><label>Date</label><input type="date" id="v-f-date" value="${d.date}"></div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>S.No</th><th>Date</th><th>Detail</th><th>Amount</th><th class="no-print"></th></tr></thead>
        <tbody id="entries-tbody">${rows}</tbody>
        <tfoot><tr><td colspan="3">Total</td><td id="voucher-total">${formatCurrency(calcLedgerGrandTotal(d.entries))}</td><td class="no-print"></td></tr></tfoot>
      </table>
    </div>
    <button class="no-print" id="add-row-btn">+ Add Row</button>
    <div class="actions no-print">
      <button class="primary" id="v-save-btn">Save</button>
      <button id="v-pdf-btn">Download PDF</button>
    </div>
    <p class="print-tip no-print">Tip: in the print window, click "More settings" and turn <strong>Headers and footers OFF</strong>, <strong>Background graphics ON</strong>.</p>
  `;
  attachLedgerEditorEvents();
}

function attachLedgerEditorEvents() {
  document.getElementById('v-back-btn').addEventListener('click', () => { showScreen('list'); renderList(); });

  document.getElementById('v-f-client').addEventListener('input', e => { currentDoc.clientName = e.target.value; });
  document.getElementById('v-f-date').addEventListener('input', e => { currentDoc.date = e.target.value; });

  document.querySelectorAll('#entries-tbody input').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = Number(e.target.dataset.idx);
      const field = e.target.dataset.field;
      currentDoc.entries[idx][field] = field === 'amount' ? Number(e.target.value) || 0 : e.target.value;
      if (field === 'amount') {
        document.getElementById('voucher-total').textContent = formatCurrency(calcLedgerGrandTotal(currentDoc.entries));
      }
    });
  });

  document.getElementById('add-row-btn').addEventListener('click', () => {
    currentDoc.entries.push({ date: currentDoc.date, detail: '', amount: 0 });
    renderLedgerEditor();
  });

  document.querySelectorAll('.remove-row').forEach(btn => {
    btn.addEventListener('click', (e) => {
      currentDoc.entries.splice(Number(e.target.dataset.idx), 1);
      renderLedgerEditor();
    });
  });

  document.getElementById('v-save-btn').addEventListener('click', async () => {
    if (!validateLedgerForSave()) return;
    if (await saveDocument(currentDoc)) { showScreen('list'); renderList(); }
  });

  document.getElementById('v-pdf-btn').addEventListener('click', () => {
    renderLedgerPrintView(currentDoc);
    window.print();
  });
}

function validateLedgerForSave() {
  const msg = document.getElementById('v-validation-msg');
  if (!currentDoc.clientName.trim() || !currentDoc.date) {
    msg.textContent = 'Client name and date are required.';
    msg.classList.remove('hidden');
    return false;
  }
  msg.classList.add('hidden');
  currentDoc.entries = currentDoc.entries.filter(e => e.detail.trim() || e.amount);
  return true;
}

/* ===== PRINT: LEDGER (Payment Voucher) =====
   A plain, static rendering built straight from the document data — matches the
   existing "Mr. X / Date: X" header, underlined title, and dark-header table used
   in the current Word documents. */
function renderLedgerPrintView(doc) {
  const rows = doc.entries.map((entry, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${formatDateShort(entry.date)}</td>
      <td>${escapeHtml(entry.detail)}</td>
      <td>${formatCurrency(entry.amount)}</td>
    </tr>`).join('');

  document.getElementById('print-area').innerHTML = `
    <div class="print-doc">
      <div class="print-header">
        <div>Mr. ${escapeHtml(doc.clientName)}</div>
        <div>Date: <strong>${formatDateLong(doc.date)}</strong></div>
      </div>
      <h2 class="print-title">${DOC_TYPES[doc.type].heading}</h2>
      <table class="print-table print-table-ledger">
        <thead><tr><th>S. No.</th><th>Date</th><th>Detail</th><th>Amount</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><td colspan="3">Total</td><td>${formatCurrency(calcLedgerGrandTotal(doc.entries))}</td></tr></tfoot>
      </table>
    </div>`;
}

/* ===== RENDER: DAILY EDITOR (Daily Expense Tracker) =====
   A flat list of entries, same "+ Add Entry" pattern as the Ledger editor,
   just with an extra "Paid To" field — you don't manually group entries into
   days, the app sorts that out for viewing/printing (see groupEntriesByDate). */
function openNewDaily() {
  currentDoc = { id: generateId(), type: 'dailyExpense', clientName: '', date: todayIso(), entries: [] };
  showScreen('daily');
  renderDailyEditor();
}

// "How much has gone to Labor/Vendor/Plumber overall" — shared markup used by
// both the live editor summary and refreshDailySummary()'s live updates.
function renderPaidToSummaryRows(entries) {
  const totals = groupByPaidTo(entries);
  if (totals.length === 0) return '<p style="color:#666;margin:8px 0 0;">No entries yet.</p>';
  return totals.map(t => `
    <div style="display:flex;justify-content:space-between;padding:4px 0;">
      <div>${escapeHtml(t.paidTo)}</div>
      <div><strong>${formatCurrency(t.total)}</strong></div>
    </div>`).join('');
}

function refreshDailySummary() {
  document.getElementById('daily-paidto-summary').innerHTML = renderPaidToSummaryRows(currentDoc.entries);
}

function renderDailyEditor() {
  const d = currentDoc;
  const rows = d.entries.map((entry, i) => `
    <tr>
      <td>${i + 1}</td>
      <td><input type="date" data-idx="${i}" data-field="date" value="${entry.date}"></td>
      <td><input type="text" data-idx="${i}" data-field="paidTo" value="${escapeHtml(entry.paidTo)}" placeholder="e.g. Labor"></td>
      <td><input type="text" data-idx="${i}" data-field="detail" value="${escapeHtml(entry.detail)}"></td>
      <td><input type="number" data-idx="${i}" data-field="amount" value="${entry.amount}"></td>
      <td class="no-print"><button class="remove-daily-row" data-idx="${i}">Remove</button></td>
    </tr>`).join('');

  document.getElementById('screen-daily').innerHTML = `
    <div class="no-print"><button id="dy-back-btn">&larr; Back</button></div>
    <h2>Daily Expense Tracker</h2>
    <div id="dy-validation-msg" class="error hidden"></div>
    <div class="field-row">
      <div><label>Project / Client Name</label><input type="text" id="dy-f-client" value="${escapeHtml(d.clientName)}"></div>
      <div><label>Date</label><input type="date" id="dy-f-date" value="${d.date}"></div>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>S.No</th><th>Date</th><th>Paid To</th><th>Detail</th><th>Amount</th><th class="no-print"></th></tr></thead>
        <tbody id="daily-entries-tbody">${rows}</tbody>
        <tfoot><tr><td colspan="4">Grand Total</td><td id="daily-total">${formatCurrency(calcLedgerGrandTotal(d.entries))}</td><td class="no-print"></td></tr></tfoot>
      </table>
    </div>
    <button class="no-print" id="add-daily-row-btn">+ Add Entry</button>

    <div style="margin-top:20px;border:1px solid var(--border);border-radius:4px;padding:12px;">
      <label style="font-size:15px;font-weight:bold;color:#1a1a1a;">Paid To Summary</label>
      <div id="daily-paidto-summary">${renderPaidToSummaryRows(d.entries)}</div>
    </div>

    <div class="actions no-print">
      <button class="primary" id="dy-save-btn">Save</button>
      <button id="dy-pdf-btn">Download PDF</button>
      <button id="dy-save-as-quotation-btn">Save as Quotation</button>
      <button id="dy-save-as-billing-btn">Save as Billing</button>
    </div>
    <p class="print-tip no-print">Tip: in the print window, click "More settings" and turn <strong>Headers and footers OFF</strong>, <strong>Background graphics ON</strong>.</p>
  `;
  attachDailyEditorEvents();
}

function attachDailyEditorEvents() {
  document.getElementById('dy-back-btn').addEventListener('click', () => { showScreen('list'); renderList(); });
  document.getElementById('dy-f-client').addEventListener('input', e => { currentDoc.clientName = e.target.value; });
  document.getElementById('dy-f-date').addEventListener('input', e => { currentDoc.date = e.target.value; });

  document.querySelectorAll('#daily-entries-tbody input').forEach(input => {
    input.addEventListener('input', (e) => {
      const idx = Number(e.target.dataset.idx);
      const field = e.target.dataset.field;
      currentDoc.entries[idx][field] = field === 'amount' ? Number(e.target.value) || 0 : e.target.value;
      if (field === 'amount') {
        document.getElementById('daily-total').textContent = formatCurrency(calcLedgerGrandTotal(currentDoc.entries));
      }
      if (field === 'amount' || field === 'paidTo') {
        refreshDailySummary();
      }
    });
  });

  document.getElementById('add-daily-row-btn').addEventListener('click', () => {
    currentDoc.entries.push({ date: currentDoc.date, paidTo: '', detail: '', amount: 0 });
    renderDailyEditor();
  });

  document.querySelectorAll('.remove-daily-row').forEach(btn => {
    btn.addEventListener('click', (e) => {
      currentDoc.entries.splice(Number(e.target.dataset.idx), 1);
      renderDailyEditor();
    });
  });

  document.getElementById('dy-save-btn').addEventListener('click', async () => {
    if (!validateDailyForSave()) return;
    if (await saveDocument(currentDoc)) { showScreen('list'); renderList(); }
  });

  document.getElementById('dy-pdf-btn').addEventListener('click', () => {
    renderDailyPrintView(currentDoc);
    window.print();
  });

  document.getElementById('dy-save-as-quotation-btn').addEventListener('click', () => convertDailyToDocument('quotation'));
  document.getElementById('dy-save-as-billing-btn').addEventListener('click', () => convertDailyToDocument('billing'));
}

function validateDailyForSave() {
  const msg = document.getElementById('dy-validation-msg');
  if (!currentDoc.clientName.trim() || !currentDoc.date) {
    msg.textContent = 'Client name and date are required.';
    msg.classList.remove('hidden');
    return false;
  }
  msg.classList.add('hidden');
  currentDoc.entries = currentDoc.entries.filter(e => e.paidTo.trim() || e.detail.trim() || e.amount);
  return true;
}

// Snapshots the current Daily Expense Tracker into a brand-new Quotation or
// Billing document — the tracker itself is untouched. All payments to the
// same recipient land in one category together (via groupEntriesForConversion),
// not scattered across separate categories per entry.
async function convertDailyToDocument(targetType) {
  if (!validateDailyForSave()) return;
  await saveDocument(currentDoc);

  const newDoc = {
    id: generateId(),
    type: targetType,
    clientName: currentDoc.clientName,
    date: currentDoc.date,
    categories: groupEntriesForConversion(currentDoc.entries),
    summary: { quotationApprovalAmount: 0, paymentReceived: 0, adjustments: [] },
  };

  if (await saveDocument(newDoc)) {
    currentDoc = newDoc;
    showScreen('categorized');
    renderCategorizedEditor();
  }
}

/* ===== PRINT: DAILY (Daily Expense Tracker) =====
   Grouped by date (via groupEntriesByDate) with a subtotal per day and a
   grand total at the end — matches how a cash disbursement log actually
   reads: what happened on which day, not just a flat list of amounts. */
function renderDailyPrintView(doc) {
  const groups = groupEntriesByDate(doc.entries);

  const rowsHtml = groups.map(group => {
    const dayHeaderRow = `<tr><td colspan="3"><strong>${formatDateLong(group.date)}</strong></td></tr>`;
    const entryRows = group.entries.map(entry => `
      <tr>
        <td>${escapeHtml(entry.paidTo)}</td>
        <td>${escapeHtml(entry.detail)}</td>
        <td>${formatCurrency(entry.amount)}</td>
      </tr>`).join('');
    const dayTotalRow = `<tr><td colspan="2"><strong>Day Total</strong></td><td><strong>${formatCurrency(group.subtotal)}</strong></td></tr>`;
    return dayHeaderRow + entryRows + dayTotalRow;
  }).join('');

  const summaryRows = groupByPaidTo(doc.entries).map(t => `
    <tr><td>${escapeHtml(t.paidTo)}</td><td>${formatCurrency(t.total)}</td></tr>`
  ).join('');

  document.getElementById('print-area').innerHTML = `
    <div class="print-doc">
      <div class="print-header">
        <div>Mr. ${escapeHtml(doc.clientName)}</div>
        <div>Date: <strong>${formatDateLong(doc.date)}</strong></div>
      </div>
      <h2 class="print-title">Daily Expense Tracker</h2>
      <table class="print-table">
        <thead><tr><th>Paid To</th><th>Detail</th><th>Amount</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot><tr class="grand-total-row"><td colspan="2">Grand Total</td><td>${formatCurrency(calcLedgerGrandTotal(doc.entries))}</td></tr></tfoot>
      </table>

      <h3 style="margin:24px 0 8px;">Paid To Summary</h3>
      <table class="print-table">
        <thead><tr><th>Paid To</th><th>Total</th></tr></thead>
        <tbody>${summaryRows}</tbody>
      </table>
    </div>`;
}

/* ===== RENDER: CATEGORIZED EDITOR (Quotation + Billing) ===== */
function openNewCategorized(type) {
  currentDoc = {
    id: generateId(), type, clientName: '', date: todayIso(), categories: [],
    summary: { quotationApprovalAmount: 0, paymentReceived: 0, adjustments: [] },
  };
  showScreen('categorized');
  renderCategorizedEditor();
}

// Documents saved before the payment-summary feature existed have no `summary` field.
function normalizeCategorized(doc) {
  doc.summary = doc.summary || { quotationApprovalAmount: 0, paymentReceived: 0, adjustments: [] };
  return doc;
}

function renderCategorizedEditor() {
  const d = currentDoc;
  const heading = DOC_TYPES[d.type].heading;

  const categoriesHtml = d.categories.map((cat, ci) => {
    const itemRows = cat.items.map((item, ii) => `
      <tr>
        <td><input type="text" data-ci="${ci}" data-ii="${ii}" data-field="description" value="${escapeHtml(item.description)}"></td>
        <td><input type="number" data-ci="${ci}" data-ii="${ii}" data-field="qty" value="${item.qty}" style="width:70px;"></td>
        <td><input type="text" data-ci="${ci}" data-ii="${ii}" data-field="unit" value="${escapeHtml(item.unit || '')}" style="width:60px;"></td>
        <td><input type="number" data-ci="${ci}" data-ii="${ii}" data-field="rate" value="${item.rate}" style="width:100px;"></td>
        <td class="item-amount" data-ci="${ci}" data-ii="${ii}">${formatCurrency(calcLineAmount(item.qty, item.rate))}</td>
        <td class="no-print"><button class="remove-item" data-ci="${ci}" data-ii="${ii}">Remove</button></td>
      </tr>`).join('');

    return `
      <div style="margin-bottom:20px;border:1px solid var(--border);border-radius:4px;padding:12px;">
        <div class="field-row" style="align-items:flex-end;">
          <div style="flex:2;">
            <label>Category</label>
            <input type="text" data-ci="${ci}" data-field="name" value="${escapeHtml(cat.name)}" placeholder="e.g. Electrician">
          </div>
          <button class="no-print remove-category" data-ci="${ci}">Remove Category</button>
        </div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Rate</th><th>Amount</th><th class="no-print"></th></tr></thead>
            <tbody>${itemRows}</tbody>
            <tfoot><tr><td colspan="4">Subtotal</td><td class="category-subtotal" data-ci="${ci}">${formatCurrency(calcCategorySubtotal(cat.items))}</td><td class="no-print"></td></tr></tfoot>
          </table>
        </div>
        <button class="no-print add-item-btn" data-ci="${ci}">+ Add Item</button>
      </div>`;
  }).join('');

  const itemsTotal = calcCategorizedGrandTotal(d.categories);
  const totalAmount = calcTotalAmount(itemsTotal, d.summary.quotationApprovalAmount);
  const balance = calcBalance(totalAmount, d.summary.paymentReceived, d.summary.adjustments);

  const adjustmentsHtml = d.summary.adjustments.map((adj, ai) => `
    <div class="field-row" style="align-items:flex-end;">
      <div style="flex:2;"><label>Adjustment (e.g. "Gazebo Difference")</label><input type="text" data-ai="${ai}" data-field="label" value="${escapeHtml(adj.label)}"></div>
      <div><label>Amount</label><input type="number" data-ai="${ai}" data-field="amount" value="${adj.amount}"></div>
      <button class="no-print remove-adjustment" data-ai="${ai}">Remove</button>
    </div>`).join('');

  document.getElementById('screen-categorized').innerHTML = `
    <div class="no-print"><button id="q-back-btn">&larr; Back</button></div>
    <h2>${heading}</h2>
    <div id="q-validation-msg" class="error hidden"></div>
    <div class="field-row">
      <div><label>Client Name</label><input type="text" id="q-f-client" value="${escapeHtml(d.clientName)}"></div>
      <div><label>Date</label><input type="date" id="q-f-date" value="${d.date}"></div>
    </div>
    <div id="categories-container">${categoriesHtml}</div>
    <button class="no-print" id="add-category-btn">+ Add Category</button>

    <div style="margin-top:20px;border:1px solid var(--border);border-radius:4px;padding:12px;">
      <label style="font-size:15px;font-weight:bold;color:#1a1a1a;">Summary</label>
      <div class="field-row">
        <div><label>Quotation Approval Amount</label><input type="number" id="q-approval-amount" value="${d.summary.quotationApprovalAmount}"></div>
        <div><label>Payment Received</label><input type="number" id="q-payment-received" value="${d.summary.paymentReceived}"></div>
      </div>
      <div id="adjustments-container">${adjustmentsHtml}</div>
      <button class="no-print" id="add-adjustment-btn">+ Add Adjustment</button>
      <div style="margin-top:12px;line-height:1.8;">
        <div>Additional Work Amount: <strong id="quotation-total">${formatCurrency(itemsTotal)}</strong></div>
        <div>Total Amount: <strong id="q-total-amount">${formatCurrency(totalAmount)}</strong></div>
        <div>Balance Amount: <strong id="q-balance-amount">${formatCurrency(balance)}</strong></div>
      </div>
    </div>

    <div class="actions no-print">
      <button class="primary" id="q-save-btn">Save</button>
      <button id="q-pdf-btn">Download PDF</button>
    </div>
    <p class="print-tip no-print">Tip: in the print window, click "More settings" and turn <strong>Headers and footers OFF</strong>, <strong>Background graphics ON</strong>.</p>
  `;
  attachCategorizedEditorEvents();
}

function refreshCategorizedSummaryTotals() {
  const itemsTotal = calcCategorizedGrandTotal(currentDoc.categories);
  const totalAmount = calcTotalAmount(itemsTotal, currentDoc.summary.quotationApprovalAmount);
  const balance = calcBalance(totalAmount, currentDoc.summary.paymentReceived, currentDoc.summary.adjustments);
  document.getElementById('quotation-total').textContent = formatCurrency(itemsTotal);
  document.getElementById('q-total-amount').textContent = formatCurrency(totalAmount);
  document.getElementById('q-balance-amount').textContent = formatCurrency(balance);
}

function attachCategorizedEditorEvents() {
  document.getElementById('q-back-btn').addEventListener('click', () => { showScreen('list'); renderList(); });
  document.getElementById('q-f-client').addEventListener('input', e => { currentDoc.clientName = e.target.value; });
  document.getElementById('q-f-date').addEventListener('input', e => { currentDoc.date = e.target.value; });

  document.querySelectorAll('[data-field="name"]').forEach(input => {
    input.addEventListener('input', e => {
      currentDoc.categories[Number(e.target.dataset.ci)].name = e.target.value;
    });
  });

  document.querySelectorAll('#categories-container input[data-ii]').forEach(input => {
    input.addEventListener('input', e => {
      const ci = Number(e.target.dataset.ci);
      const ii = Number(e.target.dataset.ii);
      const field = e.target.dataset.field;
      const item = currentDoc.categories[ci].items[ii];
      item[field] = (field === 'qty' || field === 'rate') ? Number(e.target.value) || 0 : e.target.value;
      if (field === 'qty' || field === 'rate') {
        document.querySelector(`.item-amount[data-ci="${ci}"][data-ii="${ii}"]`).textContent =
          formatCurrency(calcLineAmount(item.qty, item.rate));
        document.querySelector(`.category-subtotal[data-ci="${ci}"]`).textContent =
          formatCurrency(calcCategorySubtotal(currentDoc.categories[ci].items));
        refreshCategorizedSummaryTotals();
      }
    });
  });

  document.getElementById('add-category-btn').addEventListener('click', () => {
    currentDoc.categories.push({ name: '', items: [] });
    renderCategorizedEditor();
  });

  document.querySelectorAll('.remove-category').forEach(btn => {
    btn.addEventListener('click', e => {
      currentDoc.categories.splice(Number(e.target.dataset.ci), 1);
      renderCategorizedEditor();
    });
  });

  document.querySelectorAll('.add-item-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      currentDoc.categories[Number(e.target.dataset.ci)].items.push({ description: '', qty: 1, unit: '', rate: 0 });
      renderCategorizedEditor();
    });
  });

  document.querySelectorAll('.remove-item').forEach(btn => {
    btn.addEventListener('click', e => {
      currentDoc.categories[Number(e.target.dataset.ci)].items.splice(Number(e.target.dataset.ii), 1);
      renderCategorizedEditor();
    });
  });

  document.getElementById('q-approval-amount').addEventListener('input', e => {
    currentDoc.summary.quotationApprovalAmount = Number(e.target.value) || 0;
    refreshCategorizedSummaryTotals();
  });

  document.getElementById('q-payment-received').addEventListener('input', e => {
    currentDoc.summary.paymentReceived = Number(e.target.value) || 0;
    refreshCategorizedSummaryTotals();
  });

  document.querySelectorAll('#adjustments-container input').forEach(input => {
    input.addEventListener('input', e => {
      const ai = Number(e.target.dataset.ai);
      const field = e.target.dataset.field;
      currentDoc.summary.adjustments[ai][field] = field === 'amount' ? Number(e.target.value) || 0 : e.target.value;
      if (field === 'amount') refreshCategorizedSummaryTotals();
    });
  });

  document.getElementById('add-adjustment-btn').addEventListener('click', () => {
    currentDoc.summary.adjustments.push({ label: '', amount: 0 });
    renderCategorizedEditor();
  });

  document.querySelectorAll('.remove-adjustment').forEach(btn => {
    btn.addEventListener('click', e => {
      currentDoc.summary.adjustments.splice(Number(e.target.dataset.ai), 1);
      renderCategorizedEditor();
    });
  });

  document.getElementById('q-save-btn').addEventListener('click', async () => {
    const msg = document.getElementById('q-validation-msg');
    if (!currentDoc.clientName.trim() || !currentDoc.date) {
      msg.textContent = 'Client name and date are required.';
      msg.classList.remove('hidden');
      return;
    }
    msg.classList.add('hidden');
    currentDoc.categories = currentDoc.categories
      .map(cat => ({ ...cat, items: cat.items.filter(i => i.description.trim() || i.qty || i.rate) }))
      .filter(cat => cat.name.trim() && cat.items.length > 0);
    currentDoc.summary.adjustments = currentDoc.summary.adjustments.filter(a => a.label.trim() || a.amount);
    if (await saveDocument(currentDoc)) { showScreen('list'); renderList(); }
  });

  document.getElementById('q-pdf-btn').addEventListener('click', () => {
    renderCategorizedPrintView(currentDoc);
    window.print();
  });
}

/* ===== PRINT: CATEGORIZED (Quotation + Billing) =====
   Matches the existing "Bill Additional Work" layout: one row per category, with the
   category name and its bulleted items stacked inside the same cell (Qty/Rate/Amount
   stack line-for-line alongside them) — not a separate table row per item. Subtotals
   are not interleaved between categories; they're listed together at the end of the
   table. If a quotation approval amount, payment received, or adjustment has been
   entered, the end of the table also carries the full payment summary (Additional Work
   Amount / Quotation Approval Amount / Total Amount / Payment Received / Balance Amount,
   plus a running balance after each "Less X" adjustment) — otherwise just a plain
   Grand Total, so a simple first-time document doesn't show a wall of zero rows. */
function renderCategorizedPrintView(doc) {
  const summary = doc.summary || { quotationApprovalAmount: 0, paymentReceived: 0, adjustments: [] };
  const itemsTotal = calcCategorizedGrandTotal(doc.categories);
  const hasSummary = summary.quotationApprovalAmount !== 0 || summary.paymentReceived !== 0 || summary.adjustments.length > 0;

  const rowsHtml = doc.categories.map((cat, ci) => {
    const detailLines = [`<div><strong>${escapeHtml(cat.name)}</strong></div>`]
      .concat(cat.items.map(item => `<div>&bull; ${escapeHtml(item.description)}</div>`));
    const qtyLines = ['<div>&nbsp;</div>']
      .concat(cat.items.map(item => `<div>${item.qty}${item.unit ? ' ' + escapeHtml(item.unit) : ''}</div>`));
    const rateLines = ['<div>&nbsp;</div>']
      .concat(cat.items.map(item => `<div>${formatCurrency(item.rate)}</div>`));
    const amountLines = ['<div>&nbsp;</div>']
      .concat(cat.items.map(item => `<div><strong>${formatCurrency(calcLineAmount(item.qty, item.rate))}</strong></div>`));

    return `
      <tr>
        <td>${ci + 1}.</td>
        <td>${detailLines.join('')}</td>
        <td>${qtyLines.join('')}</td>
        <td>${rateLines.join('')}</td>
        <td>${amountLines.join('')}</td>
      </tr>
      <tr style="background-color: #f9f9f9;">
        <td colspan="4" style="text-align: right;"><strong>${escapeHtml(cat.name)} Subtotal</strong></td>
        <td><strong>${formatCurrency(calcCategorySubtotal(cat.items))}</strong></td>
      </tr>`;
  }).join('');

  let summaryRows;
  if (hasSummary) {
    const totalAmount = calcTotalAmount(itemsTotal, summary.quotationApprovalAmount);
    const balanceAfterPayment = calcBalance(totalAmount, summary.paymentReceived, []);
    let runningBalance = balanceAfterPayment;
    const adjustmentRows = summary.adjustments.map(adj => {
      runningBalance -= adj.amount;
      return `
        <tr><td colspan="4">Less ${escapeHtml(adj.label)}</td><td>${formatCurrency(adj.amount)}</td></tr>
        <tr class="grand-total-row"><td colspan="4">Balance Amount</td><td>${formatCurrency(runningBalance)}</td></tr>`;
    }).join('');
    summaryRows = `
      <tr><td colspan="4">Additional Work Amount</td><td>${formatCurrency(itemsTotal)}</td></tr>
      <tr><td colspan="4">Quotation Approval Amount</td><td>${formatCurrency(summary.quotationApprovalAmount)}</td></tr>
      <tr><td colspan="4">Total Amount</td><td>${formatCurrency(totalAmount)}</td></tr>
      <tr><td colspan="4">Payment Received</td><td>${formatCurrency(summary.paymentReceived)}</td></tr>
      <tr class="grand-total-row"><td colspan="4">Balance Amount</td><td>${formatCurrency(balanceAfterPayment)}</td></tr>
      ${adjustmentRows}`;
  } else {
    summaryRows = `<tr class="grand-total-row"><td colspan="4">Grand Total</td><td>${formatCurrency(itemsTotal)}</td></tr>`;
  }

  document.getElementById('print-area').innerHTML = `
    <div class="print-doc">
      <div class="print-header">
        <div>Mr. ${escapeHtml(doc.clientName)}</div>
        <div>Date: <strong>${formatDateLong(doc.date)}</strong></div>
      </div>
      <h2 class="print-title">${DOC_TYPES[doc.type].heading}</h2>
      <table class="print-table print-table-categorized">
        <thead><tr><th>S. No.</th><th>Details</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
        <tfoot>
          ${summaryRows}
        </tfoot>
      </table>
    </div>`;
}

/* ===== RENDER: LIST ===== */
function renderList(filter = '') {
  const docs = loadDocuments()
    .filter(d => d.clientName.toLowerCase().includes(filter.toLowerCase()))
    .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

  const rows = docs.map(d => {
    const kind = DOC_TYPES[d.type].kind;
    const total = (kind === 'ledger' || kind === 'daily')
      ? calcLedgerGrandTotal(d.entries)
      : calcCategorizedGrandTotal(d.categories);
    return `
      <div class="doc-row" data-id="${d.id}" data-type="${d.type}">
        <div>
          <strong>${escapeHtml(d.clientName)}</strong>
          <span class="badge">${DOC_TYPES[d.type].heading}</span>
          <div style="font-size:13px;color:#666;">${d.date}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div>${formatCurrency(total)}</div>
          <button class="delete-doc-btn" data-id="${d.id}" data-client="${escapeHtml(d.clientName)}" style="color:var(--error);border-color:var(--error);">Delete</button>
        </div>
      </div>`;
  }).join('') || '<p style="color:#666;">No documents yet.</p>';

  document.getElementById('screen-list').innerHTML = `
    <h1>Adorners Billing</h1>
    <div class="actions">
      <button class="primary" id="new-voucher-btn">+ New Payment Voucher</button>
      <button class="primary" id="new-daily-btn">+ New Daily Expense Tracker</button>
      <button class="primary" id="new-quotation-btn">+ New Quotation</button>
      <button class="primary" id="new-billing-btn">+ New Billing</button>
    </div>
    <div style="margin:16px 0;">
      <input type="text" id="search-input" placeholder="Search by client name..." value="${escapeHtml(filter)}">
    </div>
    <div id="doc-rows">${rows}</div>
  `;

  document.getElementById('new-voucher-btn').addEventListener('click', () => openNewLedger('voucher'));
  document.getElementById('new-daily-btn').addEventListener('click', () => openNewDaily());
  document.getElementById('new-quotation-btn').addEventListener('click', () => openNewCategorized('quotation'));
  document.getElementById('new-billing-btn').addEventListener('click', () => openNewCategorized('billing'));
  document.getElementById('search-input').addEventListener('input', (e) => renderList(e.target.value));
  document.querySelectorAll('.doc-row').forEach(row => {
    row.addEventListener('click', () => openExistingDocument(row.dataset.id, row.dataset.type));
  });
  document.querySelectorAll('.delete-doc-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const ok = confirm(`Delete the document for "${btn.dataset.client}"? This can't be undone.`);
      if (!ok) return;
      if (await deleteDocument(btn.dataset.id)) {
        renderList(document.getElementById('search-input').value);
      }
    });
  });
}

function openExistingDocument(id, type) {
  currentDoc = getDocument(id);
  if (!currentDoc) return;
  const kind = DOC_TYPES[type].kind;
  if (kind === 'ledger') { showScreen('ledger'); renderLedgerEditor(); }
  else if (kind === 'daily') { showScreen('daily'); renderDailyEditor(); }
  else { normalizeCategorized(currentDoc); showScreen('categorized'); renderCategorizedEditor(); }
}

/* ===== RENDER: LOGIN ===== */
function renderLoginScreen(errorMsg) {
  document.getElementById('screen-login').innerHTML = `
    <div style="max-width:320px;margin:80px auto;text-align:center;">
      <h1 style="font-size:22px;">Adorners Billing</h1>
      <div id="login-error" class="error${errorMsg ? '' : ' hidden'}" style="text-align:left;">${escapeHtml(errorMsg || '')}</div>
      <div style="text-align:left;margin-bottom:16px;">
        <label>Username</label>
        <input type="text" id="login-username" autocomplete="username">
      </div>
      <div style="text-align:left;margin-bottom:16px;">
        <label>Password</label>
        <input type="password" id="login-password" autocomplete="current-password">
      </div>
      <button class="primary" id="login-btn" style="width:100%;">Enter</button>
    </div>`;
  document.getElementById('login-btn').addEventListener('click', submitLogin);
  document.getElementById('login-username').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-password').focus();
  });
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') submitLogin();
  });
  document.getElementById('login-username').focus();
}

async function submitLogin() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (res.ok) {
      await bootApp();
    } else {
      const body = await res.json().catch(() => ({}));
      renderLoginScreen(body.error || 'Wrong username or password.');
    }
  } catch (err) {
    renderLoginScreen('Network error: ' + err.message);
  }
}

/* ===== INIT ===== */
async function bootApp() {
  const status = await fetchDocumentsFromServer().catch(err => 'error:' + err.message);
  if (status === 'ok') {
    showScreen('list');
    renderList();
  } else if (status === 'unauthorized') {
    showScreen('login');
    renderLoginScreen();
  } else {
    showScreen('login');
    renderLoginScreen('Could not connect: ' + String(status).replace(/^error:/, ''));
  }
}
bootApp();
</script>
